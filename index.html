<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Yaver Mark II</title>
  <link rel="stylesheet" href="style.css" />
  <!-- Installable as its own app (separate from the main Yaver app). -->
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#07090f" />
  <link rel="icon" href="icons/yaver2c.svg" type="image/svg+xml" />
  <link rel="icon" href="icons/yaver2c-64.png" sizes="64x64" />
  <link rel="apple-touch-icon" href="icons/yaver2c-apple-180.png" />
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "@mediapipe/tasks-vision": "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs"
      }
    }
  </script>
</head>
<body data-view="home">
  <!-- Home: just Yaver. -->
  <div class="home-bg" aria-hidden="true"></div>
  <header class="home-head home-only">
    <div class="home-title">YAVER <span>MARK II</span></div>
    <span class="app-version version"></span>
  </header>
  <button class="hud open-studio home-only" id="open-studio" title="Open the 3D Studio (or say &quot;open the studio&quot;)">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5 20.5 7v10L12 21.5 3.5 17V7z M3.5 7 12 11.5 20.5 7 M12 11.5v10" /></svg>
    <span>3D Studio</span>
  </button>

  <!-- The 3D Studio: shown when opened. -->
  <div id="stage" class="studio-only"></div>
  <canvas id="hands-overlay" class="studio-only"></canvas>
  <video id="camera" playsinline muted></video>

  <header class="hud hud-top studio-only">
    <button class="go-home" id="go-home" title="Back to Yaver (Esc)" aria-label="Back to Yaver">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" /></svg>
    </button>
    <div class="brand">YAVER STUDIO <span id="version" class="version"></span></div>
    <div id="status" class="status">Starting…</div>
  </header>

  <div class="help studio-only" id="help">
    <button id="help-button" class="hud help-button" title="Hand controls (H)" aria-expanded="false" aria-controls="help-panel">
      <span class="help-q">?</span><span class="help-label">Gestures</span>
    </button>
    <aside class="hud help-panel" id="help-panel">
      <h2>Hand controls</h2>
      <ul class="gestures" id="gesture-list"></ul>
      <p class="keys">Mouse: drag a shape off the shelf, drag to move or orbit, scroll to zoom, Shift + scroll to scale. Keys: 1 to 0 add shapes, Delete removes, H help, C camera.</p>
    </aside>
  </div>

  <nav class="hud shelf studio-only" id="shelf" aria-label="Shapes"></nav>

  <footer class="hud toolbar studio-only">
    <div class="group" id="colors"></div>
  </footer>

  <section class="yaver" id="yaver" data-state="idle" aria-label="Yaver assistant">
    <div class="yaver-log" id="yaver-log" aria-live="polite"></div>
    <form class="hud yaver-form" id="yaver-form">
      <input id="yaver-text" autocomplete="off" placeholder='Say "Yaver…", hold Space, or type' />
    </form>
    <div class="yaver-foot">
      <div class="yaver-meta">
        <div class="yaver-brain" id="yaver-brain">Starting…</div>
        <div class="yaver-voice" id="yaver-voice"></div>
        <div class="yaver-hint" id="yaver-hint"></div>
      </div>
      <button class="yaver-orb" id="yaver-orb" title="Talk to Yaver (or hold Space)" aria-label="Talk to Yaver">
        <span class="ring r1"></span><span class="ring r2"></span><span class="core"></span>
      </button>
    </div>
  </section>

  <button id="trash" class="hud trash studio-only" title="Drop an object here to delete it (or click to delete the selected one)">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v6M14 11v6" /></svg>
  </button>

  <script>
    // If the app fails to start, say why instead of sitting on "Starting…".
    (function () {
      var lastError = "";
      function say(text) {
        ["status", "yaver-hint"].forEach(function (id) { var el = document.getElementById(id); if (el) el.textContent = text; });
      }
      function show(msg) { lastError = msg; say("Error: " + msg); }
      window.addEventListener("error", function (e) { show(e.message || "a file failed to load"); });
      window.addEventListener("unhandledrejection", function (e) { show(String(e.reason && e.reason.message || e.reason)); });
      setTimeout(function () {
        if (!window.studioStarted) say((lastError ? "Error: " + lastError + ". " : "") + "Couldn't start. Press Cmd+Shift+R (Ctrl+Shift+R on Windows) to reload.");
      }, 10000);
      if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(function () {});
    })();
  </script>
  <script type="module" src="src/app.js?v=11"></script>
</body>
</html>
